<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VI_Arena — 3D FTC Simulation & Autonomous Replay</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <!-- Prism Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" />
  <!-- Code Inspector & Competition Suite -->
  <link rel="stylesheet" href="../code-inspector.css" />
  <link rel="stylesheet" href="../competition-suite.css" />
  <link rel="stylesheet" href="../start-pose-picker.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090c10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e6edf3;
    }
    #app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }
    #top-bar {
      height: 56px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 10;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.5px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-right: 16px;
    }
    /* Status tag, not a button: tinted text with no solid fill or border */
    .badge {
      background: rgba(35, 134, 54, 0.15);
      color: #3fb950;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.6px;
      padding: 2px 7px;
      border-radius: 3px;
      text-transform: uppercase;
      cursor: default;
      user-select: none;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      white-space: nowrap;
      min-width: 0;
    }
    /* Caption + its dropdown read as one unit */
    .ctl-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .ctl-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #7d8590;
      cursor: default;
      user-select: none;
    }
    .ctl-divider {
      width: 1px;
      height: 22px;
      background: #30363d;
      margin: 0 6px;
      flex-shrink: 0;
    }
    select, button, .file-btn {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #363b42;
      border-radius: 6px;
      height: 32px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    #team-select { max-width: 230px; }
    #recording-select { max-width: 300px; }
    #scale-select { max-width: 150px; }
    /* Narrow windows: drop captions and secondary words so nothing wraps */
    @media (max-width: 1360px) {
      .ctl-label { display: none; }
      #recording-select { max-width: 240px; }
    }
    @media (max-width: 1180px) {
      .btn-text-optional { display: none; }
      #team-select { max-width: 170px; }
      #recording-select { max-width: 200px; }
      .brand .badge { display: none; }
    }
    select:hover, button:hover, .file-btn:hover {
      background: #30363d;
      border-color: #8b949e;
      color: #f0f6fc;
    }
    .start-pose-btn {
      background: linear-gradient(135deg, rgba(88, 166, 255, 0.15), rgba(56, 139, 253, 0.25));
      border: 1px solid #388bfd;
      color: #79c0ff;
      font-weight: 600;
    }
    .start-pose-btn:hover {
      background: linear-gradient(135deg, rgba(88, 166, 255, 0.3), rgba(56, 139, 253, 0.45));
      border-color: #58a6ff;
      color: #ffffff;
    }
    select {
      max-width: 360px;
      outline: none;
    }
    #viewport-container {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: #090c10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 50;
      transition: opacity 0.3s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid #21262d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .progress-bar-bg {
      width: 260px;
      height: 6px;
      background: #21262d;
      border-radius: 3px;
      overflow: hidden;
    }
    #progress-fill {
      width: 0%;
      height: 100%;
      background: #238636;
      transition: width 0.2s ease;
    }
    #status-text {
      font-size: 13px;
      color: #8b949e;
    }
    #drop-hint {
      position: absolute;
      inset: 20px;
      border: 2px dashed #58a6ff;
      border-radius: 12px;
      background: rgba(88, 166, 255, 0.08);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      color: #58a6ff;
      pointer-events: none;
      z-index: 40;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="top-bar">
      <div class="brand">
        <span>VI_Arena 3D</span>
        <span class="badge" id="team-badge">Team 3 WebGL</span>
      </div>

      <div class="controls">
        <div class="ctl-group">
          <label for="team-select" class="ctl-label">Team</label>
          <select id="team-select" title="Team and the GitHub branch its code is pulled from">
            <option value="team3" selected>Team 3 · feature/team-3-setup</option>
            <option value="team2">Team 2 · Team2-Robot-Code</option>
            <option value="team4">Team 4 · Team_4_Branch</option>
            <option value="teamA">Team A · master</option>
            <option value="all">All teams</option>
          </select>
        </div>

        <div class="ctl-group">
          <label for="recording-select" class="ctl-label">Auto</label>
          <select id="recording-select" title="Autonomous run to replay">
            <option value="auto-Team3PedroPilotAutoOpMode.json">Team3PedroPilotAutoOpMode (Pedro Pathing)</option>
            <option value="auto-Team3AutonomousOpMode.json">Team3AutonomousOpMode (Score Specimen)</option>
            <option value="auto-Team3AutoOpMode.json">Team3AutoOpMode</option>
            <option value="auto-Team3TempStrafeRight8AutoOpMode.json">Team3TempStrafeRight8AutoOpMode</option>
            <option value="auto-Team3WebcamTestAutoOpMode.json">Team3WebcamTestAutoOpMode</option>
          </select>
        </div>

        <div class="ctl-group">
          <label for="scale-select" class="ctl-label">Zoom</label>
          <select id="scale-select" title="Simulation UI scale">
            <option value="large" selected>Large (150%)</option>
            <option value="medium">Medium (125%)</option>
            <option value="compact">Compact (100%)</option>
            <option value="native">Native (1:1)</option>
          </select>
        </div>

        <span class="ctl-divider" aria-hidden="true"></span>

        <label class="file-btn" title="Open a .json recording from your computer">
          📂 <span class="btn-text-optional">Load JSON</span>
          <input type="file" id="file-input" accept=".json" style="display: none;">
        </label>

        <button id="btn-start-pose" class="start-pose-btn" onclick="openStartPoseModal()" title="Place robot at custom position and heading before autonomous">🎯 <span class="btn-text-optional">Start Pose</span></button>
        <button id="btn-comp-suite" class="comp-suite-btn" onclick="openCompetitionSuite()" title="Match preparation and competition tools">🏆 Match Strategy</button>
        <button id="btn-view-code" class="code-inspector-btn" onclick="openCurrentOpModeCode()" title="View robot source code from GitHub branches">💻 Robot Code</button>
        <button id="btn-fullscreen" title="Fullscreen">⛶ <span class="btn-text-optional">Fullscreen</span></button>
      </div>
    </div>

    <div id="viewport-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="drop-hint">Drop .json recording here to replay</div>
      <div id="web-mode-pill" style="display: none; position: absolute; background: #0b0e12; border: none; z-index: 15; pointer-events: auto; box-sizing: border-box; cursor: default; user-select: none;" title="This web version replays recorded runs; live driving needs the desktop app">
        <span style="color: #6e7681; font-size: 10.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; height: 100%; letter-spacing: 0.8px; text-transform: uppercase;"><span style="width: 6px; height: 6px; border-radius: 50%; background: #3fb950; display: inline-block;"></span>Web replay</span>
      </div>

      <div id="loading-overlay">
        <div class="spinner"></div>
        <div style="font-size: 16px; font-weight: 600;">Loading VI_Arena 3D Simulation...</div>
        <div class="progress-bar-bg">
          <div id="progress-fill"></div>
        </div>
        <div id="status-text">Downloading 3D Arena & Team 3 Autonomous runs...</div>
      </div>
    </div>
  </div>

  <script src="Build/vi_arena.loader.js"></script>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const overlay = document.querySelector("#loading-overlay");
    const progressFill = document.querySelector("#progress-fill");
    const statusText = document.querySelector("#status-text");
    const recordingSelect = document.querySelector("#recording-select");
    const teamSelect = document.querySelector("#team-select");
    const teamBadge = document.querySelector("#team-badge");
    const scaleSelect = document.querySelector("#scale-select");
    const fileInput = document.querySelector("#file-input");
    const dropHint = document.querySelector("#drop-hint");
    let globalUnityInstance = null;

    // Load saved scale preference if present
    const savedScale = localStorage.getItem("vi_arena_ui_scale");
    if (savedScale && scaleSelect) {
      scaleSelect.value = savedScale;
    }

    function updateCanvasScale() {
      const viewport = document.querySelector("#viewport-container");
      if (!viewport) return;
      const w = viewport.clientWidth;
      const h = viewport.clientHeight;
      if (w <= 0 || h <= 0) return;

      const mode = scaleSelect ? scaleSelect.value : "large";

      let targetHeight = 780; // Large (150% UI size - very legible)
      if (mode === "medium") {
        targetHeight = 920;   // Medium (125% UI size)
      } else if (mode === "compact") {
        targetHeight = 1080;  // Compact (100% UI size)
      } else if (mode === "native") {
        targetHeight = Math.round(h * (window.devicePixelRatio || 1));
      }

      let targetWidth;
      if (mode === "native") {
        targetWidth = Math.round(w * (window.devicePixelRatio || 1));
      } else {
        targetWidth = Math.max(960, Math.round(targetHeight * (w / h)));
      }

      if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
        canvas.width = targetWidth;
        canvas.height = targetHeight;
        if (globalUnityInstance && globalUnityInstance.Module && globalUnityInstance.Module.setCanvasSize) {
          try {
            globalUnityInstance.Module.setCanvasSize(targetWidth, targetHeight);
          } catch(e) {}
        }
      }

      // Position the Web Mode pill seamlessly over the desktop-only socket buttons
      const pill = document.querySelector("#web-mode-pill");
      if (pill) {
        pill.style.display = "block";
        pill.style.top = ((100 / canvas.height) * 100) + "%";
        pill.style.height = ((24 / canvas.height) * 100) + "%";
        pill.style.right = (((16 + 330 + 8) / canvas.width) * 100) + "%";
        pill.style.width = (((200 + 8 + 190) / canvas.width) * 100) + "%";
      }
    }

    // Set initial resolution before Unity initializes
    updateCanvasScale();
    window.addEventListener("resize", updateCanvasScale);
    if (scaleSelect) {
      scaleSelect.addEventListener("change", (e) => {
        localStorage.setItem("vi_arena_ui_scale", e.target.value);
        updateCanvasScale();
      });
    }

    // Block desktop-only socket trigger keys (L: Live Mode, U: Live Physics) in WebGL
    window.addEventListener("keydown", (e) => {
      if (e.key === "l" || e.key === "L" || e.key === "u" || e.key === "U") {
        const modal = document.querySelector("#code-inspector-modal");
        if (!modal || !modal.classList.contains("active")) {
          e.stopPropagation();
        }
      }
    }, true);

    const bundledRecordings = [
      "auto-Team3PedroPilotAutoOpMode.json",
      "auto-Team3AutonomousOpMode.json",
      "auto-Team3AutoOpMode.json",
      "auto-Team3TempStrafeRight8AutoOpMode.json",
      "auto-Team3WebcamTestAutoOpMode.json",
      "auto-TeamAAutoOpMode.json"
    ];

    const bundledFields = [
      "biobuzz-2026.json"
    ];

    function unityShowBanner(msg, type) {
      console.log(`[Unity ${type}] ${msg}`);
    }

    const config = {
      matchWebGLToCanvasSize: false,
      arguments: [
        "-recordings", "/recordings",
        "-fields", "/fields",
        "-robot", "gobilda-starter-bot"
      ],
      dataUrl: "Build/vi_arena.data",
      frameworkUrl: "Build/vi_arena.framework.js",
      codeUrl: "Build/vi_arena.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "PVI FTC",
      productName: "VI_Arena",
      productVersion: "1.0",
      showBanner: unityShowBanner,
      preRun: [function(module) {
        module.addRunDependency("harness_assets");
        statusText.textContent = "Preloading BIOBUZZ 3D field and autonomous runs...";

        const fieldPromises = bundledFields.map(f =>
          fetch("fields/" + f)
            .then(res => res.arrayBuffer())
            .then(buf => ({ dir: "/fields", name: f, data: new Uint8Array(buf) }))
        );

        const recPromises = bundledRecordings.map(r =>
          fetch("recordings/" + r)
            .then(res => res.arrayBuffer())
            .then(buf => ({ dir: "/recordings", name: r, data: new Uint8Array(buf) }))
        );

        Promise.all([...fieldPromises, ...recPromises])
          .then(files => {
            files.forEach(file => {
              try {
                module.FS_createPath("/", file.dir.replace(/^\//, ""), true, true);
                module.FS_createDataFile(file.dir, file.name, file.data, true, true, true);
              } catch (err) {
                console.warn("FS preload warning:", file.dir + "/" + file.name, err);
              }
            });
            module.removeRunDependency("harness_assets");
          })
          .catch(err => {
            console.error("Asset preload failed:", err);
            module.removeRunDependency("harness_assets");
          });
      }]
    };

    createUnityInstance(canvas, config, (progress) => {
      progressFill.style.width = (progress * 100) + "%";
      if (progress < 0.9) {
        statusText.textContent = `Compiling 3D Engine & Shader Assets (${Math.round(progress * 100)}%)...`;
      } else {
        statusText.textContent = "Launching 3D Field View...";
      }
    }).then((instance) => {
      globalUnityInstance = instance;
      overlay.classList.add("hidden");

      const teamProfiles = {
        team3: {
          name: "Team 3 (BioBuzz)",
          badge: "Team 3 WebGL",
          branch: "feature/team-3-setup",
          runs: [
            { value: "auto-Team3PedroPilotAutoOpMode.json", text: "Team3PedroPilotAutoOpMode (Pedro Pathing)" },
            { value: "auto-Team3AutonomousOpMode.json", text: "Team3AutonomousOpMode (Score Specimen)" },
            { value: "auto-Team3AutoOpMode.json", text: "Team3AutoOpMode" },
            { value: "auto-Team3TempStrafeRight8AutoOpMode.json", text: "Team3TempStrafeRight8AutoOpMode" },
            { value: "auto-Team3WebcamTestAutoOpMode.json", text: "Team3WebcamTestAutoOpMode" }
          ]
        },
        team2: {
          name: "Team 2",
          badge: "Team 2 WebGL",
          branch: "Team2-Robot-Code",
          runs: [
            { value: "auto-Team3AutonomousOpMode.json", text: "Team 2 Autonomous (Simulated Specimen)" }
          ]
        },
        team4: {
          name: "Team 4",
          badge: "Team 4 WebGL",
          branch: "Team_4_Branch",
          runs: [
            { value: "auto-Team3AutoOpMode.json", text: "Team 4 Autonomous (Simulated Sample)" }
          ]
        },
        teamA: {
          name: "Team A (Starter Bot)",
          badge: "Team A WebGL",
          branch: "master",
          runs: [
            { value: "auto-TeamAAutoOpMode.json", text: "TeamAAutoOpMode (Autonomous Demo)" }
          ]
        }
      };

      function renderTeamRuns(teamKey, autoPlayFirst = true) {
        if (!recordingSelect) return;
        recordingSelect.innerHTML = "";

        let runsToRender = [];
        if (teamKey === "all") {
          if (teamBadge) teamBadge.textContent = "All Teams WebGL";
          for (const [key, profile] of Object.entries(teamProfiles)) {
            profile.runs.forEach(r => {
              const tag = key === "team3" ? "[Team 3]" : key === "teamA" ? "[Team A]" : `[${profile.name}]`;
              runsToRender.push({ value: r.value, text: `${tag} ${r.text}` });
            });
          }
        } else if (teamProfiles[teamKey]) {
          const profile = teamProfiles[teamKey];
          if (teamBadge) teamBadge.textContent = profile.badge;
          runsToRender = [...profile.runs];
        }

        runsToRender.forEach(r => {
          const opt = document.createElement("option");
          opt.value = r.value;
          opt.textContent = r.text;
          recordingSelect.appendChild(opt);
        });

        if (runsToRender.length > 0 && autoPlayFirst && globalUnityInstance) {
          openRecording("/recordings/" + runsToRender[0].value);
        }
      }

      if (teamSelect) {
        teamSelect.addEventListener("change", (e) => {
          renderTeamRuns(e.target.value, true);
        });
      }

      // Initial populate
      renderTeamRuns(teamSelect ? teamSelect.value : "team3", false);

      // Setup fullscreen
      document.querySelector("#btn-fullscreen").onclick = () => {
        instance.SetFullscreen(1);
      };

      // Dropdown selection change
      recordingSelect.addEventListener("change", (e) => {
        const file = e.target.value;
        openRecording("/recordings/" + file);
      });

      // Drag & Drop support
      window.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropHint.style.display = "flex";
      });
      window.addEventListener("dragleave", (e) => {
        if (e.relatedTarget === null) dropHint.style.display = "none";
      });
      window.addEventListener("drop", (e) => {
        e.preventDefault();
        dropHint.style.display = "none";
        if (e.dataTransfer.files.length > 0) {
          handleFileInput(e.dataTransfer.files[0]);
        }
      });

      // File input picker
      fileInput.addEventListener("change", (e) => {
        if (e.target.files.length > 0) {
          handleFileInput(e.target.files[0]);
        }
      });
    }).catch((msg) => {
      alert("Error initializing 3D WebGL Arena: " + msg);
      console.error(msg);
    });

    function openRecording(path) {
      if (globalUnityInstance) {
        console.log("Opening recording in VI_Arena:", path);
        globalUnityInstance.SendMessage("Harness Replay", "Open", path);
      }
    }

    function handleFileInput(file) {
      if (!file.name.endsWith(".json")) {
        alert("Please select a .json harness recording file.");
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const content = new Uint8Array(e.target.result);
          const module = globalUnityInstance.Module;
          const vPath = "/recordings/" + file.name;
          try {
            module.FS_createDataFile("/recordings", file.name, content, true, true, true);
          } catch(dup) {
            // Overwrite if exists
            module.FS.writeFile(vPath, content);
          }

          // Inspect header to detect team name
          try {
            const previewText = new TextDecoder().decode(content.slice(0, 4096));
            let teamName = "Custom Robot";
            const driveModelMatch = previewText.match(/"driveModel"\s*:\s*\{[^}]*"name"\s*:\s*"([^"]+)"/);
            if (driveModelMatch) {
              teamName = driveModelMatch[1];
            } else {
              const opModeMatch = previewText.match(/"opMode"\s*:\s*"([^"]+)"/);
              if (opModeMatch) teamName = opModeMatch[1].replace(/Auto(OpMode)?$/, "");
            }

            if (teamSelect) {
              let customOpt = Array.from(teamSelect.options).find(o => o.text.includes(teamName));
              if (!customOpt) {
                customOpt = document.createElement("option");
                customOpt.value = "custom_" + Date.now();
                customOpt.textContent = `📁 ${teamName}`;
                teamSelect.appendChild(customOpt);
              }
              teamSelect.value = customOpt.value;
            }
            if (teamBadge) teamBadge.textContent = `${teamName} WebGL`;
          } catch(headerErr) {
            console.warn("Could not parse team header:", headerErr);
          }

          // Add to dropdown if not present
          let opt = Array.from(recordingSelect.options).find(o => o.value === file.name);
          if (!opt) {
            opt = document.createElement("option");
            opt.value = file.name;
            opt.textContent = file.name;
            recordingSelect.appendChild(opt);
          }
          recordingSelect.value = file.name;

          // Open in Unity
          openRecording(vPath);
        } catch (err) {
          console.error("Failed loading dropped file into virtual FS:", err);
          alert("Error loading recording: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function openCurrentOpModeCode() {
      const val = recordingSelect.value || "";
      const currentTeam = teamSelect ? teamSelect.value : "team3";
      let branch = "feature/team-3-setup";
      let targetPath = "TeamCode/src/main/java/org/firstinspires/ftc/teamcode/opmodes/teleop/Team3TeleOp.java";

      if (currentTeam === "teamA" || val.includes("TeamA")) {
        branch = "master";
        targetPath = "TeamCode/src/main/java/org/firstinspires/ftc/teamcode/opmodes/autonomous/TeamAAutoOpMode.java";
      } else if (currentTeam === "team2" || val.includes("Team2")) {
        branch = "Team2-Robot-Code";
      } else if (currentTeam === "team4" || val.includes("Team4")) {
        branch = "Team_4_Branch";
      } else {
        if (val.includes("PedroPilot")) {
          targetPath = "TeamCode/src/main/java/org/firstinspires/ftc/teamcode/opmodes/autonomous/Team3PedroPilotAutoOpMode.java";
        } else if (val.includes("AutonomousOpMode")) {
          targetPath = "TeamCode/src/main/java/org/firstinspires/ftc/teamcode/opmodes/autonomous/Team3AutonomousOpMode.java";
        } else if (val.includes("AutoOpMode")) {
          targetPath = "TeamCode/src/main/java/org/firstinspires/ftc/teamcode/opmodes/autonomous/Team3AutoOpMode.java";
        } else if (val.includes("TempStrafeRight8")) {
          targetPath = "TeamCode/src/main/java/org/firstinspires/ftc/teamcode/opmodes/autonomous/Team3TempStrafeRight8AutoOpMode.java";
        } else if (val.includes("WebcamTest")) {
          targetPath = "TeamCode/src/main/java/org/firstinspires/ftc/teamcode/opmodes/autonomous/Team3WebcamTestAutoOpMode.java";
        }
      }

      if (window.openCodeInspector) {
        window.openCodeInspector(targetPath, branch);
      }
    }
