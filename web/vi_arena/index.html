 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VI_Arena — 3D FTC Simulation & Autonomous Replay</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <!-- Prism Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" />
  <!-- Code Inspector & Competition Suite -->
  <link rel="stylesheet" href="assets/code-inspector.css" />
  <link rel="stylesheet" href="assets/competition-suite.css" />
  <link rel="stylesheet" href="assets/start-pose-picker.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070a;
      font-family: "Bahnschrift", "DIN Alternate", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      color: #e2e8f0;
    }
    #app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }
    /* Elevated Sapphire-Obsidian Web Command Deck separated by a crisp cyan telemetry seam */
    #top-bar {
      height: 46px;
      background: linear-gradient(180deg, #0d1522 0%, #070b11 100%);
      border-bottom: 1px solid rgba(56, 189, 248, 0.34);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 4px 16px rgba(0, 0, 0, 0.85), 0 1px 0 rgba(56, 189, 248, 0.14);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 20;
      flex-shrink: 0;
      position: relative;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-right: 12px;
    }
    .brand-bar {
      width: 3px;
      height: 20px;
      background: #38bdf8;
      border-radius: 1px;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.55);
      flex-shrink: 0;
    }
    .brand-title {
      font-weight: 700;
      font-size: 13.5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #f8fafc;
    }
    .deck-tag {
      font-family: "Consolas", "SF Mono", ui-monospace, monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.09);
      border: 1px solid rgba(56, 189, 248, 0.36);
      padding: 2px 6px;
      border-radius: 2px;
      user-select: none;
    }
    .badge {
      font-family: "Consolas", "SF Mono", ui-monospace, monospace;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #1e293b;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.4px;
      padding: 2px 7px;
      border-radius: 2px;
      max-width: 185px;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: default;
      user-select: none;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: nowrap;
      white-space: nowrap;
      min-width: 0;
    }
    /* Recessed Instrument Selector Pod: Label + Select inside one crisp frame */
    .ctl-group {
      display: inline-flex;
      align-items: center;
      height: 28px;
      background: #05080d;
      border: 1px solid #1e293b;
      border-radius: 3px;
      overflow: hidden;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .ctl-group:hover,
    .ctl-group:focus-within {
      border-color: rgba(56, 189, 248, 0.65);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.14);
    }
    .ctl-label {
      font-family: "Consolas", "SF Mono", ui-monospace, monospace;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: #64748b;
      padding: 0 8px;
      height: 100%;
      display: inline-flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.65);
      border-right: 1px solid #162030;
      cursor: default;
      user-select: none;
    }
    .ctl-group select {
      background: transparent;
      color: #e2e8f0;
      border: none;
      border-radius: 0;
      height: 100%;
      padding: 0 8px;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
    }
    .ctl-group select option,
    .ctl-group select optgroup {
      background: #0b111a;
      color: #e2e8f0;
    }
    .ctl-divider {
      width: 1px;
      height: 20px;
      background: linear-gradient(180deg, transparent, #253247, transparent);
      margin: 0 4px;
      flex-shrink: 0;
    }
    button, .file-btn {
      background: #0e141f;
      color: #cbd5e1;
      border: 1px solid #253247;
      border-radius: 3px;
      height: 28px;
      padding: 0 10px;
      font-family: "Bahnschrift", "Segoe UI", sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.14s ease;
    }
    button svg, .file-btn svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }
    button:hover, .file-btn:hover {
      background: #172132;
      border-color: #475569;
      color: #f8fafc;
    }
    .start-pose-btn {
      background: rgba(56, 189, 248, 0.08);
      border-color: rgba(56, 189, 248, 0.42);
      color: #7dd3fc;
    }
    .start-pose-btn:hover {
      background: rgba(56, 189, 248, 0.18);
      border-color: #38bdf8;
      color: #ffffff;
    }
    .comp-suite-btn {
      background: rgba(245, 158, 11, 0.08);
      border-color: rgba(245, 158, 11, 0.42);
      color: #fcd34d;
    }
    .comp-suite-btn:hover {
      background: rgba(245, 158, 11, 0.18);
      border-color: #f59e0b;
      color: #ffffff;
    }
    .code-inspector-btn {
      background: rgba(129, 140, 248, 0.09);
      border-color: rgba(129, 140, 248, 0.42);
      color: #a5b4fc;
    }
    .code-inspector-btn:hover {
      background: rgba(129, 140, 248, 0.2);
      border-color: #818cf8;
      color: #ffffff;
    }
    #team-select { max-width: 185px; }
    #recording-select { max-width: 215px; }
    #scale-select { max-width: 122px; }
    @media (max-width: 1580px) {
      .badge { display: none; }
    }
    @media (max-width: 1360px) {
      #team-select { max-width: 150px; }
      #recording-select { max-width: 175px; }
      .ctl-label { padding: 0 6px; font-size: 9px; }
    }
    @media (max-width: 1220px) {
      .ctl-label { display: none; }
      .btn-text-optional { display: none; }
    }
    #viewport-container {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: #05070a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 50;
      transition: opacity 0.3s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid #162030;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .progress-bar-bg {
      width: 260px;
      height: 5px;
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 2px;
      overflow: hidden;
    }
    #progress-fill {
      width: 0%;
      height: 100%;
      background: #38bdf8;
      transition: width 0.2s ease;
    }
    #status-text {
      font-family: "Consolas", "SF Mono", ui-monospace, monospace;
      font-size: 12px;
      color: #64748b;
    }
    #drop-hint {
      position: absolute;
      inset: 20px;
      border: 2px dashed #38bdf8;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.07);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #7dd3fc;
      pointer-events: none;
      z-index: 40;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="top-bar">
      <div class="brand">
        <span class="brand-bar" aria-hidden="true"></span>
        <span class="brand-title">VI_Arena</span>
        <span class="deck-tag">Web Deck</span>
        <span class="badge" id="team-badge">feature/team-3-setup</span>
      </div>

      <div class="controls">
        <div class="ctl-group" title="GitHub branch from PVI-FTC/ftc-robot-framework">
          <label for="team-select" class="ctl-label">Branch</label>
          <select id="team-select">
            <option value="">Loading branches...</option>
          </select>
        </div>

        <div class="ctl-group" title="Autonomous run to replay">
          <label for="recording-select" class="ctl-label">Auto</label>
          <select id="recording-select">
            <option value="">Loading runs...</option>
          </select>
        </div>

        <div class="ctl-group" title="Simulation UI scale">
          <label for="scale-select" class="ctl-label">Zoom</label>
          <select id="scale-select">
            <option value="large" selected>Large (150%)</option>
            <option value="medium">Medium (125%)</option>
            <option value="compact">Compact (100%)</option>
            <option value="native">Native (1:1)</option>
          </select>
        </div>

        <span class="ctl-divider" aria-hidden="true"></span>

        <label class="file-btn" title="Open a .json recording from your computer">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10V3M5 6l3-3 3 3M2.5 11.5v1.5a1 1 0 001 1h9a1 1 0 001-1v-1.5"/></svg>
          <span class="btn-text-optional">Load JSON</span>
          <input type="file" id="file-input" accept=".json" style="display: none;">
        </label>

        <button id="btn-start-pose" class="start-pose-btn" onclick="openStartPoseModal()" title="Place robot at custom position and heading before autonomous">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="5"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/></svg>
          <span class="btn-text-optional">Start Pose</span>
        </button>

        <button id="btn-comp-suite" class="comp-suite-btn" onclick="openCompetitionSuite()" title="BIOBUZZ 2026 match preparation and telemetry analysis">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 13.5h12M3.5 11V7.5M8 11V4M12.5 11V6"/></svg>
          <span>Match Strategy</span>
        </button>

        <button id="btn-view-code" class="code-inspector-btn" onclick="openCurrentOpModeCode()" title="Inspect Java OpMode source code from GitHub branches">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5M9 3l-2 10"/></svg>
          <span>Robot Code</span>
        </button>

        <button id="btn-fullscreen" title="Toggle Fullscreen">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg>
          <span class="btn-text-optional">Fullscreen</span>
        </button>
      </div>
    </div>

    <div id="viewport-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="drop-hint">Drop .json recording here to replay</div>

      <div id="loading-overlay">
        <div class="spinner"></div>
        <div style="font-size: 16px; font-weight: 600;">Loading VI_Arena 3D Simulation...</div>
        <div class="progress-bar-bg">
          <div id="progress-fill"></div>
        </div>
        <div id="status-text">Downloading 3D Arena & Team 3 Autonomous runs...</div>
      </div>
    </div>
  </div>

  <script src="Build/vi_arena.loader.js"></script>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const overlay = document.querySelector("#loading-overlay");
    const progressFill = document.querySelector("#progress-fill");
    const statusText = document.querySelector("#status-text");
    const recordingSelect = document.querySelector("#recording-select");
    const teamSelect = document.querySelector("#team-select");
    const teamBadge = document.querySelector("#team-badge");
    const scaleSelect = document.querySelector("#scale-select");
    const fileInput = document.querySelector("#file-input");
    const dropHint = document.querySelector("#drop-hint");
    let globalUnityInstance = null;

    // Load saved scale preference if present
    const savedScale = localStorage.getItem("vi_arena_ui_scale");
    if (savedScale && scaleSelect) {
      scaleSelect.value = savedScale;
    }

    function updateCanvasScale() {
      const viewport = document.querySelector("#viewport-container");
      if (!viewport) return;
      const w = viewport.clientWidth;
      const h = viewport.clientHeight;
      if (w <= 0 || h <= 0) return;

      const mode = scaleSelect ? scaleSelect.value : "large";

      let targetHeight = 780; // Large (150% UI size - very legible)
      if (mode === "medium") {
        targetHeight = 920;   // Medium (125% UI size)
      } else if (mode === "compact") {
        targetHeight = 1080;  // Compact (100% UI size)
      } else if (mode === "native") {
        targetHeight = Math.round(h * (window.devicePixelRatio || 1));
      }

      let targetWidth;
      if (mode === "native") {
        targetWidth = Math.round(w * (window.devicePixelRatio || 1));
      } else {
        targetWidth = Math.max(960, Math.round(targetHeight * (w / h)));
      }

      if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
        canvas.width = targetWidth;
        canvas.height = targetHeight;
        if (globalUnityInstance && globalUnityInstance.Module && globalUnityInstance.Module.setCanvasSize) {
          try {
            globalUnityInstance.Module.setCanvasSize(targetWidth, targetHeight);
          } catch(e) {}
        }
      }
    }

    // Set initial resolution before Unity initializes
    updateCanvasScale();
    window.addEventListener("resize", updateCanvasScale);
    if (scaleSelect) {
      scaleSelect.addEventListener("change", (e) => {
        localStorage.setItem("vi_arena_ui_scale", e.target.value);
        updateCanvasScale();
      });
    }

    // Block desktop-only socket trigger keys (L: Live Mode, U: Live Physics) in WebGL
    window.addEventListener("keydown", (e) => {
      if (e.key === "l" || e.key === "L" || e.key === "u" || e.key === "U") {
        const modal = document.querySelector("#code-inspector-modal");
        if (!modal || !modal.classList.contains("active")) {
          e.stopPropagation();
        }
      }
    }, true);

    let manifestData = null;
    const loadedVirtualPaths = new Set();
    window.virtualFileCache = new Map();
    window.customFileVirtualPaths = new Map();

    const fallbackManifest = {
      repo: "PVI-FTC/ftc-robot-framework",
      defaultBranch: "feature/team-3-setup",
      branches: {
        "feature/team-3-setup": {
          folder: ".",
          commit: "local",
          recordings: [
            { file: "auto-Team3PedroPilotAutoOpMode.json", label: "Team3PedroPilotAutoOpMode" },
            { file: "auto-Team3AutonomousOpMode.json", label: "Team3AutonomousOpMode" },
            { file: "auto-Team3AutoOpMode.json", label: "Team3AutoOpMode" },
            { file: "auto-Team3TempStrafeRight8AutoOpMode.json", label: "Team3TempStrafeRight8AutoOpMode" },
            { file: "auto-Team3WebcamTestAutoOpMode.json", label: "Team3WebcamTestAutoOpMode" }
          ]
        },
        "master": {
          folder: ".",
          commit: "local",
          recordings: [
            { file: "auto-TeamAAutoOpMode.json", label: "TeamAAutoOpMode" },
            { file: "auto-TeamAPedroPilotAutoOpMode.json", label: "TeamAPedroPilotAutoOpMode" }
          ]
        }
      }
    };

    const bundledFields = [
      "biobuzz-2026.json"
    ];

    function unityShowBanner(msg, type) {
      console.log(`[Unity ${type}] ${msg}`);
    }

    function recordingUrl(branchInfo, file) {
      const folder = branchInfo && branchInfo.folder && branchInfo.folder !== "." ? branchInfo.folder + "/" : "";
      return "recordings/" + folder + file;
    }

    function virtualPath(branchInfo, file) {
      const folder = branchInfo && branchInfo.folder && branchInfo.folder !== "." ? branchInfo.folder + "/" : "";
      return "/recordings/" + folder + file;
    }

    function writeToEmscriptenFS(module, vPath, bytes) {
      const parts = vPath.split("/").filter(Boolean);
      const fileName = parts.pop();
      const dir = "/" + parts.join("/");
      if (parts.length > 0) {
        module.FS_createPath("/", parts.join("/"), true, true);
      }
      let actualPath = vPath;
      try {
        module.FS_createDataFile(dir, fileName, bytes, true, true, true);
      } catch (dup) {
        const dotIdx = fileName.lastIndexOf(".");
        const base = dotIdx >= 0 ? fileName.slice(0, dotIdx) : fileName;
        const ext = dotIdx >= 0 ? fileName.slice(dotIdx) : "";
        const uniqueName = `${base}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}${ext}`;
        actualPath = (dir === "/" ? "" : dir) + "/" + uniqueName;
        module.FS_createDataFile(dir, uniqueName, bytes, true, true, true);
      }
      loadedVirtualPaths.add(actualPath);
      window.virtualFileCache.set(actualPath, bytes);
      return actualPath;
    }

    function populateBranches(manifest) {
      if (!teamSelect) return;
      teamSelect.innerHTML = "";
      const names = Object.keys(manifest.branches || {});
      names.forEach(name => {
        const info = manifest.branches[name];
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = info.commit ? `${name} (${info.commit})` : name;
        teamSelect.appendChild(opt);
      });
      if (manifest.defaultBranch && manifest.branches[manifest.defaultBranch]) {
        teamSelect.value = manifest.defaultBranch;
      } else if (names.length > 0) {
        teamSelect.value = names[0];
      }
    }

    function renderBranchRuns(branchName) {
      if (!recordingSelect) return;
      recordingSelect.innerHTML = "";
      const info = manifestData?.branches?.[branchName];
      if (teamBadge) {
        teamBadge.textContent = branchName || "PVI FTC";
      }
      if (!info || !info.recordings || info.recordings.length === 0) {
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "No autonomous runs";
        recordingSelect.appendChild(opt);
        return;
      }
      info.recordings.forEach(r => {
        const opt = document.createElement("option");
        opt.value = r.file;
        opt.textContent = r.label || r.file;
        recordingSelect.appendChild(opt);
      });
    }

    async function ensureAndOpenRecording(branchName, fileName) {
      if (!globalUnityInstance || !fileName) return;
      const info = manifestData?.branches?.[branchName];
      if (!info) {
        openRecording(window.customFileVirtualPaths.get(fileName) || ("/recordings/" + fileName));
        return;
      }
      let vPath = virtualPath(info, fileName);
      if (!loadedVirtualPaths.has(vPath)) {
        try {
          const url = recordingUrl(info, fileName);
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status} fetching ${url}`);
          const buf = await res.arrayBuffer();
          vPath = writeToEmscriptenFS(globalUnityInstance.Module, vPath, new Uint8Array(buf));
        } catch (err) {
          console.error("Failed to fetch recording:", err);
          alert("Could not load recording: " + err.message);
          return;
        }
      }
      openRecording(vPath);
    }

    async function bootViewer() {
      try {
        const res = await fetch("recordings/manifest.json?t=" + Date.now());
        manifestData = res.ok ? await res.json() : fallbackManifest;
      } catch (e) {
        console.warn("Could not load manifest.json, using fallback:", e);
        manifestData = fallbackManifest;
      }
      window.manifestData = manifestData;

      populateBranches(manifestData);
      const initialBranch = teamSelect ? teamSelect.value : manifestData.defaultBranch;
      renderBranchRuns(initialBranch);

      const initialInfo = manifestData.branches[initialBranch];
      const initialRecordings = initialInfo ? initialInfo.recordings : [];

      const config = {
        matchWebGLToCanvasSize: false,
        autoSyncPersistentDataPath: true,
        arguments: [
          "-recordings", "/recordings",
          "-fields", "/fields",
          "-robot", "gobilda-starter-bot"
        ],
        dataUrl: "Build/vi_arena.data",
        frameworkUrl: "Build/vi_arena.framework.js",
        codeUrl: "Build/vi_arena.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "PVI FTC",
        productName: "VI_Arena",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        preRun: [function(module) {
          module.addRunDependency("harness_assets");
          statusText.textContent = "Preloading BIOBUZZ 3D field and autonomous runs...";

          const fieldPromises = bundledFields.map(f =>
            fetch("fields/" + f)
              .then(res => res.arrayBuffer())
              .then(buf => ({ vPath: "/fields/" + f, data: new Uint8Array(buf) }))
          );

          const robotPromises = [
            fetch("robots/gobilda-starter-bot/robot.properties")
              .then(res => {
                if (!res.ok) throw new Error("Missing robot.properties");
                return res.arrayBuffer();
              })
              .then(buf => ({ vPath: "/robots/gobilda-starter-bot/robot.properties", data: new Uint8Array(buf) }))
          ];

          const recPromises = initialRecordings.map(r =>
            fetch(recordingUrl(initialInfo, r.file))
              .then(res => res.arrayBuffer())
              .then(buf => ({ vPath: virtualPath(initialInfo, r.file), data: new Uint8Array(buf) }))
          );

          Promise.all([...fieldPromises, ...robotPromises, ...recPromises])
            .then(files => {
              files.forEach(file => {
                try {
                  writeToEmscriptenFS(module, file.vPath, file.data);
                } catch (err) {
                  console.warn("FS preload warning:", file.vPath, err);
                }
              });
              module.removeRunDependency("harness_assets");
            })
            .catch(err => {
              console.error("Asset preload failed:", err);
              module.removeRunDependency("harness_assets");
            });
        }]
      };

      createUnityInstance(canvas, config, (progress) => {
        progressFill.style.width = (progress * 100) + "%";
        if (progress < 0.9) {
          statusText.textContent = `Compiling 3D Engine & Shader Assets (${Math.round(progress * 100)}%)...`;
        } else {
          statusText.textContent = "Launching 3D Field View...";
        }
      }).then((instance) => {
        globalUnityInstance = instance;
        overlay.classList.add("hidden");

        if (teamSelect) {
          teamSelect.addEventListener("change", (e) => {
            const branch = e.target.value;
            renderBranchRuns(branch);
            if (recordingSelect && recordingSelect.value) {
              ensureAndOpenRecording(branch, recordingSelect.value);
            }
          });
        }

        // Setup fullscreen
        document.querySelector("#btn-fullscreen").onclick = () => {
          instance.SetFullscreen(1);
        };

        // Dropdown selection change
        recordingSelect.addEventListener("change", (e) => {
          ensureAndOpenRecording(teamSelect ? teamSelect.value : initialBranch, e.target.value);
        });

        // Drag & Drop support
        window.addEventListener("dragover", (e) => {
          e.preventDefault();
          dropHint.style.display = "flex";
        });
        window.addEventListener("dragleave", (e) => {
          if (e.relatedTarget === null) dropHint.style.display = "none";
        });
        window.addEventListener("drop", (e) => {
          e.preventDefault();
          dropHint.style.display = "none";
          if (e.dataTransfer.files.length > 0) {
            handleFileInput(e.dataTransfer.files[0]);
          }
        });

        // File input picker
        fileInput.addEventListener("change", (e) => {
          if (e.target.files.length > 0) {
            handleFileInput(e.target.files[0]);
            e.target.value = "";
          }
        });
      }).catch((msg) => {
        alert("Error initializing 3D WebGL Arena: " + msg);
        console.error(msg);
      });
    }

    bootViewer();

    function openRecording(path) {
      window.currentActiveVirtualPath = path;
      if (globalUnityInstance) {
        console.log("Opening recording in VI_Arena:", path);
        globalUnityInstance.SendMessage("Harness Replay", "Open", path);
      }
    }

    function handleFileInput(file) {
      if (!file.name.endsWith(".json")) {
        alert("Please select a .json harness recording file.");
        return;
      }
      if (!globalUnityInstance || !globalUnityInstance.Module) {
        alert("Wait for the 3D Arena to finish loading first.");
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const content = new Uint8Array(e.target.result);
          const module = globalUnityInstance.Module;
          const vPath = writeToEmscriptenFS(module, "/recordings/" + file.name, content);
          window.customFileVirtualPaths.set(file.name, vPath);

          // Inspect header to detect team name
          try {
            const previewText = new TextDecoder().decode(content.slice(0, 4096));
            let teamName = "Custom Robot";
            const driveModelMatch = previewText.match(/"driveModel"\s*:\s*\{[^}]*"name"\s*:\s*"([^"]+)"/);
            if (driveModelMatch) {
              teamName = driveModelMatch[1];
            } else {
              const opModeMatch = previewText.match(/"opMode"\s*:\s*"([^"]+)"/);
              if (opModeMatch) teamName = opModeMatch[1].replace(/Auto(OpMode)?$/, "");
            }

            if (teamSelect) {
              let customOpt = Array.from(teamSelect.options).find(o => o.text.includes(teamName));
              if (!customOpt) {
                customOpt = document.createElement("option");
                customOpt.value = "custom_" + Date.now();
                customOpt.textContent = `📁 ${teamName}`;
                teamSelect.appendChild(customOpt);
              }
              teamSelect.value = customOpt.value;
            }
            if (teamBadge) teamBadge.textContent = `${teamName} WebGL`;
          } catch(headerErr) {
            console.warn("Could not parse team header:", headerErr);
          }

          // Add to dropdown if not present
          let opt = Array.from(recordingSelect.options).find(o => o.value === file.name);
          if (!opt) {
            opt = document.createElement("option");
            opt.value = file.name;
            opt.textContent = file.name;
            recordingSelect.appendChild(opt);
          }
          recordingSelect.value = file.name;

          // Open in Unity
          openRecording(vPath);
        } catch (err) {
          console.error("Failed loading dropped file into virtual FS:", err);
          alert("Error loading recording: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function openCurrentOpModeCode() {
      const val = recordingSelect.value || "";
      const selectedBranch = (teamSelect && teamSelect.value && !teamSelect.value.startsWith("custom_"))
        ? teamSelect.value
        : (manifestData?.defaultBranch || "feature/team-3-setup");
      let className = val.replace(/^auto-/, "").replace(/\.json$/, "");

      try {
        const activeBytes = window.virtualFileCache && window.currentActiveVirtualPath
          ? window.virtualFileCache.get(window.currentActiveVirtualPath)
          : null;
        if (activeBytes) {
          const preview = new TextDecoder().decode(activeBytes.slice(0, 2048));
          const m = preview.match(/"opMode"\s*:\s*"([A-Za-z0-9_]+)"/);
          if (m && m[1]) className = m[1];
        }
      } catch (_) {}

      const targetPath = className
        ? `TeamCode/src/main/java/org/firstinspires/ftc/teamcode/opmodes/autonomous/${className}.java`
        : "TeamCode/src/main/java/org/firstinspires/ftc/teamcode/opmodes/autonomous/Team3AutonomousOpMode.java";

      if (window.openCodeInspector) {
        window.openCodeInspector(targetPath, selectedBranch, className);
      }
    }
  </script>
