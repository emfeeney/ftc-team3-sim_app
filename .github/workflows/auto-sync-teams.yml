name: Auto-Sync All Branches & Generate 3D Runs

permissions:
  contents: write

on:
  schedule:
    # Check for updated team branches every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild all branches even if commit unchanged'
        required: false
        default: 'false'
        type: boolean

jobs:
  sync-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (skip large LFS binaries)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sync and simulate all branches from PVI-FTC/ftc-robot-framework
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python3 web/sync-all-branches.py --force
          else
            python3 web/sync-all-branches.py
          fi

      - name: Restore working files
        run: |
          git checkout -- TeamCode build.dependencies.gradle th_src/harness.properties || true

      - name: Commit and Push Updated Recordings
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Sim Bot"
          git add web/vi_arena/recordings/
          if git diff --cached --quiet; then
            echo "No recording changes to commit."
          else
            git commit -m "Auto-sync autonomous recordings from PVI-FTC/ftc-robot-framework"
            git pull --rebase origin main
            git push origin main
          fi
