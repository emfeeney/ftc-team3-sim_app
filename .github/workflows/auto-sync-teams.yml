name: Auto-Sync Teams & Generate 3D Runs

on:
  schedule:
    # Run once daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Upstream branch from PVI-FTC/ftc-robot-framework to sync'
        required: true
        default: 'feature/team-3-setup'

jobs:
  sync-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Auto-Sync & Simulation Pipeline
        run: |
          BRANCH="${{ github.event.inputs.branch || 'feature/team-3-setup' }}"
          chmod +x scripts/sync_and_generate.sh
          bash scripts/sync_and_generate.sh "$BRANCH"

      - name: Commit and Push Updated Recordings & Configurations
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Sim Bot"
          git add configs/ web/vi_arena/recordings/ web/build/ th_src/harness.properties web/harness.properties TeamCode/
          git diff-index --quiet HEAD || (git commit -m "Auto-sync team code and update 3D autonomous recordings" && git push origin main)

