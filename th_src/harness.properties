# Harness settings: the one file to change when the harness is dropped into another FTC repo.
# Every key is explained in ../docs/README.md, section "The config file (harness.properties)".
# Lines starting with # are comments. Paths are relative to this folder (TestHarness/th_src).

# Which layout of this file the harness expects. Goes up when keys change.
config.version=5

# --- Build (read by build.gradle) ------------------------------------------------------------

# The robot code to compile and test. It is only read, never changed.
teamCode.sourceDir=../TeamCode/src/main/java
# Java packages (comma-separated) searched for @TeleOp / @Autonomous OpModes.
teamCode.opModePackages=org.firstinspires.ftc.teamcode
# The robot build's library list. The harness uses the same libraries and versions.
host.dependenciesFile=../build.dependencies.gradle
# Libraries in that list that only work on Android, so the harness leaves them out.
host.skipLibraries=org.firstinspires.ftc:Inspection,org.firstinspires.ftc:Blocks,\
  org.firstinspires.ftc:RobotServer,org.firstinspires.ftc:OnBotJava,androidx.appcompat:appcompat

# --- Robot profile (read by HarnessConfig) ---------------------------------------------------

# The robot's name in reports, recordings and the viewer.
robot.name=Team 3

# Names in the robot configuration, the same strings TeamCode passes to hardwareMap.get(...).
drive.frontLeft=frontLeft
drive.frontRight=frontRight
drive.rearLeft=rearLeft
drive.rearRight=rearRight
pinpoint=pinpoint
# Other motors the fake robot has (comma-separated; may be empty).
hardware.otherMotors=intake, outtake, midtake
# Servos the fake robot has (comma-separated; may be empty).
hardware.servos=intake-deploy
# Other devices the fake robot has, by type (comma-separated names; each may be empty).
devices.imu=
devices.crServos=
devices.distanceSensors=
devices.touchSensors=
devices.colorSensors=
devices.analogInputs=
devices.otos=
devices.limelights=
devices.blinkers=
devices.webcams=Webcam 1
# For each webcam above, where it sits and what it sees (webcam.<name>.<fact>), as facts.
webcam.Webcam\ 1.forwardInches=6.0 | placeholder | TeamCode Team3VisionConfiguration CAMERA_FORWARD_INCHES
webcam.Webcam\ 1.leftInches=0.0 | placeholder | TeamCode Team3VisionConfiguration CAMERA_RIGHT_INCHES
webcam.Webcam\ 1.upInches=12.0 | placeholder | TeamCode Team3VisionConfiguration CAMERA_UP_INCHES
webcam.Webcam\ 1.yawDegrees=0 | placeholder | TeamCode Team3VisionConfiguration mount angles 0, 0, 0
webcam.Webcam\ 1.pitchDegrees=0 | placeholder | TeamCode Team3VisionConfiguration mount angles 0, 0, 0
webcam.Webcam\ 1.rollDegrees=0 | placeholder | TeamCode Team3VisionConfiguration mount angles 0, 0, 0
webcam.Webcam\ 1.horizontalFovDegrees=65.9 | placeholder | not measured; Logitech 78 degree diagonal for the C920, split for a 4:3 picture
webcam.Webcam\ 1.verticalFovDegrees=51.8 | placeholder | not measured; Logitech 78 degree diagonal for the C920, split for a 4:3 picture
webcam.Webcam\ 1.imageWidthPixels=640 | measured | TeamCode Team3VisionConfiguration STREAM_WIDTH
webcam.Webcam\ 1.imageHeightPixels=480 | measured | TeamCode Team3VisionConfiguration STREAM_HEIGHT
webcam.Webcam\ 1.maxRangeInches=120 | placeholder | not measured; a guess (10 ft) for a field AprilTag at 640 x 480
webcam.Webcam\ 1.maxViewAngleDegrees=60 | placeholder | not measured; AprilTag detection gets unreliable past about 60 to 70 degrees
# field: the webcam sees the field's tags that are in view; script: only what a test's AprilTagScript says.
webcam.Webcam\ 1.aprilTags=field
# Dead-wheel odometry pods: name:parallel:leftInches or name:perpendicular:forwardInches, comma-
# separated. The name is the motor port the pod's encoder is plugged into.
devices.deadWheels=

# For each drive motor: the direction setting (FORWARD or REVERSE) that makes that wheel drive
# the robot forward on positive power, as tested on the real robot.
drive.frontLeft.direction=REVERSE
drive.frontRight.direction=FORWARD
drive.rearLeft.direction=REVERSE
drive.rearRight.direction=FORWARD

# Robot facts. Each is: number | measured or placeholder | where it came from (or how to measure).
# Change "placeholder" to "measured" only after measuring on the real robot (see ../docs/CALIBRATION.md).
drive.forwardSpeedInchesPerSecond=70.01563114118758 | measured | Pedro maxAchievableForwardVelocity in Team3PedroConfiguration
drive.strafeSpeedInchesPerSecond=52.014594764628455 | measured | Pedro maxAchievableStrafeVelocity in Team3PedroConfiguration
drive.forwardCoastInchesPerSecondSquared=32.54832913388586 | measured | Pedro naturalForwardDeceleration in Team3PedroConfiguration
drive.lateralCoastInchesPerSecondSquared=62.89693210699509 | measured | Pedro naturalStrafeDeceleration in Team3PedroConfiguration
robot.lengthInches=18.0 | measured | Confirmed Team 3 18x18 inch chassis length, bumper to bumper
robot.widthInches=18.0 | measured | Confirmed Team 3 18x18 inch chassis width, bumper to bumper
drive.turnRateDegreesPerSecond=240.6 | measured | Derived from Team3PedroConfiguration headingBrakeCoefficients and 18x18 chassis geometry
drive.responseTimeSeconds=0.0685 | measured | Derived from Team3PedroConfiguration linearBrakeCoefficients (0.06848421743295197)
drive.maxAccelerationInchesPerSecondSquared=249.2 | measured | Derived from Team3PedroConfiguration quadraticBrakeCoefficients (1 / (2 * 0.00200645))
drive.speedVoltage=12.5 | measured | Nominal 12.5V competition battery voltage during Pedro 3 tuner runs

# --- PVI extras ------------------------------------------------------------------------------

# true: also build PVI's own extras (src/pvi/java, src/pviTest/java), which read Team A's Pedro
# configuration and check that the numbers above still match it. Set false in any other repo.
pvi.extras=false

# --- Field and viewer ------------------------------------------------------------------------

# The season field, a file in fields/ without ".json".
field=biobuzz-2026
# true: the HIVE frame's feet and lips and the FLOWERs stop the simulated robot like the walls do.
field.robotObstacles=true
# Step 15: true opens the viewer after "gradlew test" finishes, on the run's newest recording
# (or the failed test's). Skipped with no screen. The tests themselves never open a window.
viewer.open=false
# The TeleOp the viewer drives when it opens: its Driver Station name or its class name.
# Empty means the first TeleOp by Driver Station name.
viewer.defaultTeleOp=Team 3 Mecanum Drive

# --- Smoke test ------------------------------------------------------------------------------

# OpModes (Driver Station names, comma-separated) the run-every-OpMode smoke test leaves out.
smokeTest.skipOpModes=KimCode TeleopV1, Team A Pedro Paths, Team A Mecanum Drive, Team A AprilTag Vision Test, Team A Camera Calibration Capture, Team A Pedro Diagnostic, Team B TeleOp, Team C TeleOp
# TeleOps (Driver Station names) that aren't meant to drive, so the smoke test doesn't expect the
# left stick to power a drive motor (they still get the crash check).
smokeTest.notDrivingTeleOps=Team 3 AprilTag Vision Test, Team 3 Pedro Diagnostic
