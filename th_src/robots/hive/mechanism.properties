# The Hive robot's intake and launcher (see ../README.md, "mechanism.properties"). The harness watches
# the motors KimLauncher already runs. Nothing here is measured on the robot.

# The intake. The same motor as the feed: TeleopV1's commented-out code collects with it at negative
# power, and KimLauncher feeds with REVERSE and positive power, which is the same way round.
intake.motor=intake
intake.direction=REVERSE
intake.minPower=0.1 | placeholder | a guess
intake.forwardInches=10 | placeholder | a guess: at the front of the 18 in robot box
intake.leftInches=0 | placeholder | a guess: the middle of the front
intake.lengthInches=3 | placeholder | a guess
intake.widthInches=10 | placeholder | a guess
intake.spitSeconds=0.3 | placeholder | a guess
intake.spitInchesPerSecond=30 | placeholder | a guess

# What it holds.
hold.capacity=4 | placeholder | what G407 in the manual allows; the real robot isn't measured
hold.accepts=pollen
hold.preloaded=4 | placeholder | PRELOADED_BALLS in HiveAuto and TU06 10.3.1

# The launcher wheel. From KimLauncher: the names and directions, which KimLauncher itself says to check.
launcher.motor=pollen
launcher.direction=REVERSE
launcher.ticksPerRev=28 | placeholder | a guess: a motor with no gearbox, which HiveShotTable's 1200 to 1650 ticks/s suit
launcher.freeSpeedRpm=6000 | placeholder | a guess: the same motor
launcher.spinUpSeconds=0.3 | placeholder | a guess
launcher.speedLossPerShot=0.15 | placeholder | a guess
launcher.wheelDiameterInches=4 | placeholder | a guess
launcher.exitFraction=0.5 | placeholder | a guess: a ball rolling between the wheel and a fixed plate
launcher.minBallInchesPerSecond=20 | placeholder | a guess

# What pushes balls into the wheel. KimLauncher's FEED_SECONDS is 0.35, so one shot needs less than that here.
feed.motor=intake
feed.direction=REVERSE
feed.minPower=0.1 | placeholder | a guess
feed.secondsPerBall=0.3 | placeholder | a guess, under KimLauncher's FEED_SECONDS of 0.35, itself a placeholder

# Where a ball leaves.
launch.forwardInches=6 | placeholder | a guess
launch.leftInches=0 | placeholder | a guess
launch.upInches=14 | placeholder | a guess
launch.pitchDegrees=60 | placeholder | a guess
launch.yawDegrees=0 | placeholder | a guess
