# KimCode's robot's camera, so its replays show a camera view like the other robots (the user asked
# for every robot used in tests to have one). A copy of team-a's webcam: every number is a
# placeholder, because nothing about this robot's camera has been measured. TeleopV1, SimpleLeave
# and FieldCentricTest don't look this webcam up (they use the Limelight), so it changes only what
# a replay shows. Replace the numbers when the real camera and its mount are known.

# The robot's webcams (comma-separated). Empty means no webcam.
devices.webcams=logitechVisionWebcam
# For each webcam above, where it sits and what it sees (webcam.<name>.<fact>), as facts. The mount
# is from the robot's center on the floor: forward, left (negative: right) and up. Angles 0, 0, 0
# mean level and looking straight forward; yaw + turns the lens left, pitch + tilts it up, roll +
# turns the picture clockwise seen from behind. maxRangeInches: farthest tag it still reads;
# maxViewAngleDegrees: how far a tag may be turned away and still be read.
webcam.logitechVisionWebcam.forwardInches=4.875 | placeholder | team-a's value, not measured on this robot
webcam.logitechVisionWebcam.leftInches=-6.875 | placeholder | team-a's value, not measured on this robot
webcam.logitechVisionWebcam.upInches=19.0 | placeholder | team-a's value, not measured on this robot
webcam.logitechVisionWebcam.yawDegrees=0 | placeholder | team-a's value, not measured on this robot
webcam.logitechVisionWebcam.pitchDegrees=18 | placeholder | team-a's value, not measured on this robot
webcam.logitechVisionWebcam.rollDegrees=0 | placeholder | team-a's value, not measured on this robot
webcam.logitechVisionWebcam.horizontalFovDegrees=65.9 | placeholder | team-a's value, not measured on this robot
webcam.logitechVisionWebcam.verticalFovDegrees=51.8 | placeholder | team-a's value, not measured on this robot
webcam.logitechVisionWebcam.imageWidthPixels=640 | placeholder | team-a's value, not measured on this robot
webcam.logitechVisionWebcam.imageHeightPixels=480 | placeholder | team-a's value, not measured on this robot
webcam.logitechVisionWebcam.maxRangeInches=120 | placeholder | team-a's value, not measured on this robot
webcam.logitechVisionWebcam.maxViewAngleDegrees=60 | placeholder | team-a's value, not measured on this robot
# field: the webcam sees the field's tags that are in view; script: only what a test's AprilTagScript says.
webcam.logitechVisionWebcam.aprilTags=field
