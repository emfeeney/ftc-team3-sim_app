# ==============================================================================
# TEAM 3 (BIOBUZZ) - ROBOT PROFILE & SIMULATION CONFIGURATION
# Framework Branch: feature/team-3-setup
# Repository: https://github.com/PVI-FTC/ftc-robot-framework.git
# ==============================================================================
config.version=5

teamCode.sourceDir=../TeamCode/src/main/java
teamCode.opModePackages=org.firstinspires.ftc.teamcode
host.dependenciesFile=../build.dependencies.gradle
host.skipLibraries=org.firstinspires.ftc:Inspection,org.firstinspires.ftc:Blocks,\
  org.firstinspires.ftc:RobotServer,org.firstinspires.ftc:OnBotJava,androidx.appcompat:appcompat

# --- Robot Identity & Hardware Map Names ---
robot.name=Team 3 (BioBuzz)
robot.branch=feature/team-3-setup

drive.frontLeft=frontLeft
drive.frontRight=frontRight
drive.rearLeft=rearLeft
drive.rearRight=rearRight
pinpoint=pinpoint

hardware.otherMotors=intake, outtake, midtake
hardware.servos=intake-deploy

devices.imu=
devices.crServos=
devices.distanceSensors=
devices.touchSensors=
devices.colorSensors=
devices.analogInputs=
devices.otos=
devices.limelights=
devices.webcams=Webcam 1
devices.blinkers=
devices.deadWheels=

drive.frontLeft.direction=REVERSE
drive.frontRight.direction=FORWARD
drive.rearLeft.direction=REVERSE
drive.rearRight.direction=FORWARD

# --- Physical Calibration Facts (Measured on Team 3 Robot) ---
robot.lengthInches=18.0 | measured | Confirmed Team 3 18x18 inch chassis length, bumper to bumper
robot.widthInches=18.0 | measured | Confirmed Team 3 18x18 inch chassis width, bumper to bumper

drive.forwardSpeedInchesPerSecond=70.02 | measured | Team3PedroConfiguration maxAchievableForwardVelocity (70.01563114118758)
drive.strafeSpeedInchesPerSecond=52.01 | measured | Team3PedroConfiguration maxAchievableStrafeVelocity (52.014594764628455)
drive.turnRateDegreesPerSecond=240.6 | measured | Derived from Team3PedroConfiguration headingBrakeCoefficients and 18x18 chassis geometry
drive.responseTimeSeconds=0.0685 | measured | Derived from Team3PedroConfiguration linearBrakeCoefficients (0.06848421743295197)
drive.forwardCoastInchesPerSecondSquared=32.55 | measured | Team3PedroConfiguration naturalForwardDeceleration (32.54832913388586)
drive.lateralCoastInchesPerSecondSquared=62.90 | measured | Team3PedroConfiguration naturalStrafeDeceleration (62.89693210699509)
drive.maxAccelerationInchesPerSecondSquared=249.2 | measured | Derived from Team3PedroConfiguration quadraticBrakeCoefficients (1 / (2 * 0.00200645))
drive.speedVoltage=12.5 | measured | Nominal 12.5V competition battery voltage during Pedro 3 tuner runs

pvi.extras=false
field=biobuzz-2026
field.robotObstacles=true
viewer.open=false
viewer.defaultTeleOp=Team 3 Mecanum Drive

smokeTest.skipOpModes=KimCode TeleopV1, Team A Pedro Paths, Team A Mecanum Drive, Team A AprilTag Vision Test, Team A Camera Calibration Capture, Team A Pedro Diagnostic, Team B TeleOp, Team C TeleOp
smokeTest.notDrivingTeleOps=Team 3 AprilTag Vision Test, Team 3 Pedro Diagnostic
