# ==============================================================================
# TEAM ROBOT CONFIGURATION TEMPLATE
# Copy this file to: configs/teams/team<YourNumber>.properties
#
# HOW TO CONFIGURE YOUR TEAM'S ROBOT:
# 1. Fill in your team's robot name and hardware device names below.
# 2. Update the "Robot Facts" section with your robot's measurements.
#    (If you use Pedro Pathing, copy the values directly from your Pedro tuner OpModes!)
# 3. Change "placeholder" to "measured" for each value you've verified.
# ==============================================================================
config.version=5

teamCode.sourceDir=../TeamCode/src/main/java
teamCode.opModePackages=org.firstinspires.ftc.teamcode
host.dependenciesFile=../build.dependencies.gradle
host.skipLibraries=org.firstinspires.ftc:Inspection,org.firstinspires.ftc:Blocks,\
  org.firstinspires.ftc:RobotServer,org.firstinspires.ftc:OnBotJava,androidx.appcompat:appcompat

# --- Robot Identity & GitHub Branch ---
robot.name=My Team Name
# Upstream branch on PVI-FTC/ftc-robot-framework:
robot.branch=main

# --- Motor Configuration (Hardware Map Names) ---
# The exact names your TeamCode passes to hardwareMap.get(DcMotor.class, "...")
drive.frontLeft=frontLeft
drive.frontRight=frontRight
drive.rearLeft=rearLeft
drive.rearRight=rearRight
pinpoint=pinpoint

# Other motors and servos (comma-separated names, or leave blank):
hardware.otherMotors=intake, outtake, lift
hardware.servos=claw, arm

# Other sensors (comma-separated names, or leave blank):
devices.imu=imu
devices.crServos=
devices.distanceSensors=
devices.touchSensors=
devices.colorSensors=
devices.analogInputs=
devices.otos=
devices.limelights=
devices.webcams=Webcam 1
devices.blinkers=
devices.deadWheels=

# Drive motor directions (FORWARD or REVERSE)
drive.frontLeft.direction=REVERSE
drive.frontRight.direction=FORWARD
drive.rearLeft.direction=REVERSE
drive.rearRight.direction=FORWARD

# ==============================================================================
# ROBOT FACTS (PHYSICAL MEASUREMENTS)
# Format: <number> | <measured or placeholder> | <source or notes>
# ==============================================================================

# Chassis dimensions (bumper to bumper in inches):
robot.lengthInches=18.0 | placeholder | Measure bumper-to-bumper with tape measure
robot.widthInches=18.0 | placeholder | Measure bumper-to-bumper with tape measure

# Maximum speeds (Pedro maxAchievableForwardVelocity & maxAchievableStrafeVelocity):
drive.forwardSpeedInchesPerSecond=65.0 | placeholder | Measured forward top speed in in/s
drive.strafeSpeedInchesPerSecond=50.0 | placeholder | Measured strafe top speed in in/s

# Maximum spin turn rate (deg/s):
drive.turnRateDegreesPerSecond=200.0 | placeholder | Full power turn rate in deg/s

# Drivetrain response time lag (seconds):
# Time to reach ~63% of commanded speed, or Pedro linearBrakeCoefficient b1:
drive.responseTimeSeconds=0.08 | placeholder | Typical 0.06 - 0.10 s for goBILDA motors

# Zero-power coasting deceleration (in/s²):
# Pedro naturalForwardDeceleration & naturalStrafeDeceleration:
drive.forwardCoastInchesPerSecondSquared=32.0 | placeholder | Coasting deceleration forward
drive.lateralCoastInchesPerSecondSquared=60.0 | placeholder | Coasting deceleration sideways

# Maximum wheel traction grip limit (in/s²):
# From Pedro quadraticBrakeCoefficient: a = 1 / (2 * b2) (typically 200 - 250 in/s²):
drive.maxAccelerationInchesPerSecondSquared=220.0 | placeholder | Traction grip limit

# Battery voltage when tuner tests were run (Volts):
drive.speedVoltage=12.5 | placeholder | Nominal competition battery voltage

# --- Field & Viewer Settings ---
pvi.extras=false
field=biobuzz-2026
field.robotObstacles=true
viewer.open=false
viewer.defaultTeleOp=

# Skip OpModes that should not run during autonomous generation:
smokeTest.skipOpModes=KimCode TeleopV1
smokeTest.notDrivingTeleOps=
