# ==============================================================================
# TEAM A (STARTER BOT) - ROBOT PROFILE & SIMULATION CONFIGURATION
# Framework Branch: master / TeamA-Mini1-Basic-Auto
# Repository: https://github.com/PVI-FTC/ftc-robot-framework.git
# ==============================================================================
config.version=5

teamCode.sourceDir=../TeamCode/src/main/java
teamCode.opModePackages=org.firstinspires.ftc.teamcode
host.dependenciesFile=../build.dependencies.gradle
host.skipLibraries=org.firstinspires.ftc:Inspection,org.firstinspires.ftc:Blocks,\
  org.firstinspires.ftc:RobotServer,org.firstinspires.ftc:OnBotJava,androidx.appcompat:appcompat

# --- Robot Identity & Hardware Map Names ---
robot.name=Team A (Starter Bot)
robot.branch=master

drive.frontLeft=frontLeft
drive.frontRight=frontRight
drive.rearLeft=rearLeft
drive.rearRight=rearRight
pinpoint=pinpoint

hardware.otherMotors=intake
hardware.servos=

devices.imu=
devices.crServos=
devices.distanceSensors=
devices.touchSensors=
devices.colorSensors=
devices.analogInputs=
devices.otos=
devices.limelights=
devices.webcams=Webcam 1
devices.blinkers=
devices.deadWheels=

drive.frontLeft.direction=REVERSE
drive.frontRight.direction=FORWARD
drive.rearLeft.direction=REVERSE
drive.rearRight.direction=FORWARD

# --- Physical Calibration Facts ---
robot.lengthInches=18.0 | measured | Standard 18x18 starter bot chassis
robot.widthInches=18.0 | measured | Standard 18x18 starter bot chassis

drive.forwardSpeedInchesPerSecond=62.61 | measured | Team A measured forward velocity
drive.strafeSpeedInchesPerSecond=49.76 | measured | Team A measured strafe velocity
drive.turnRateDegreesPerSecond=180.0 | placeholder | Full power turn rate in degrees/sec
drive.responseTimeSeconds=0.10 | placeholder | Typical goBILDA 312 rpm motor response lag
drive.forwardCoastInchesPerSecondSquared=30.0 | placeholder | Natural forward coasting decel
drive.lateralCoastInchesPerSecondSquared=60.0 | placeholder | Natural strafe coasting decel
drive.maxAccelerationInchesPerSecondSquared=200.0 | placeholder | Mecanum tire traction limit
drive.speedVoltage=12.5 | placeholder | Nominal 12.5V battery voltage

pvi.extras=false
field=biobuzz-2026
field.robotObstacles=true
viewer.open=false
viewer.defaultTeleOp=Team A Mecanum Drive

smokeTest.skipOpModes=KimCode TeleopV1, Team 3 Autonomous, Team 3 Autonomous Demo, Team 3 Pedro Paths, Team 3 Temp Strafe Right 8 in, Team 3 Webcam Test (Auto), Team B TeleOp, Team C TeleOp
smokeTest.notDrivingTeleOps=Team A AprilTag Vision Test, Team A Pedro Diagnostic
