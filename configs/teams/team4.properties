# ==============================================================================
# TEAM 4 - ROBOT PROFILE & SIMULATION CONFIGURATION
# Framework Branch: Team_4_Branch
# Repository: https://github.com/PVI-FTC/ftc-robot-framework.git
# ==============================================================================
config.version=5

teamCode.sourceDir=../TeamCode/src/main/java
teamCode.opModePackages=org.firstinspires.ftc.teamcode
host.dependenciesFile=../build.dependencies.gradle
host.skipLibraries=org.firstinspires.ftc:Inspection,org.firstinspires.ftc:Blocks,\
  org.firstinspires.ftc:RobotServer,org.firstinspires.ftc:OnBotJava,androidx.appcompat:appcompat

robot.name=Team 4
robot.branch=Team_4_Branch

drive.frontLeft=frontLeft
drive.frontRight=frontRight
drive.rearLeft=rearLeft
drive.rearRight=rearRight
pinpoint=pinpoint

hardware.otherMotors=
hardware.servos=

devices.imu=
devices.crServos=
devices.distanceSensors=
devices.touchSensors=
devices.colorSensors=
devices.analogInputs=
devices.otos=
devices.limelights=
devices.webcams=
devices.blinkers=
devices.deadWheels=

drive.frontLeft.direction=REVERSE
drive.frontRight.direction=FORWARD
drive.rearLeft.direction=REVERSE
drive.rearRight.direction=FORWARD

robot.lengthInches=18.0 | placeholder | Team 4 chassis length in inches
robot.widthInches=18.0 | placeholder | Team 4 chassis width in inches

drive.forwardSpeedInchesPerSecond=60.0 | placeholder | Top forward speed
drive.strafeSpeedInchesPerSecond=48.0 | placeholder | Top strafe speed
drive.turnRateDegreesPerSecond=180.0 | placeholder | Turn rate in deg/s
drive.responseTimeSeconds=0.10 | placeholder | Motor response time
drive.forwardCoastInchesPerSecondSquared=30.0 | placeholder | Forward coast decel
drive.lateralCoastInchesPerSecondSquared=55.0 | placeholder | Strafe coast decel
drive.maxAccelerationInchesPerSecondSquared=200.0 | placeholder | Traction limit
drive.speedVoltage=12.5 | placeholder | Tuning battery voltage

pvi.extras=false
field=biobuzz-2026
field.robotObstacles=true
viewer.open=false
viewer.defaultTeleOp=Team 4 TeleOp

smokeTest.skipOpModes=KimCode TeleopV1
smokeTest.notDrivingTeleOps=

